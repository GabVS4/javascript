<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Tabuada</title>

</head>
<body>

        <h1>Tabuada</h1>

    <section>

        </div>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
    
    <script src="script.js"></script>
